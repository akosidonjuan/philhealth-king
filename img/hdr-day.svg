 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d2"/><stop offset="1" stop-color="#fff6d2" stop-opacity="0"/></radialGradient>
 <clipPath id="win"><path d="M128 112 V44 Q128 14 200 12 Q272 14 272 44 V112 Z"/></clipPath>
</defs>
<rect width="400" height="140" fill="url(#wall)"/>
